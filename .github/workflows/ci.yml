name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint and format
        run: bunx biome check .
      - name: Unit and TUI tests
        run: bun test packages
      - name: CLI smoke test on a non-tty stdout
        run: |
          set +e
          bun run --cwd packages/cli src/index.tsx < /dev/null > /tmp/smoke.out 2> /tmp/smoke.err
          code=$?
          set -e
          echo "exit=$code"
          cat /tmp/smoke.err
          test "$code" -eq 1
          test ! -s /tmp/smoke.out
          grep -q "needs an interactive terminal" /tmp/smoke.err
